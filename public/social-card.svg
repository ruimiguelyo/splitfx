<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Rui Sá frontend portfolio and SplitFX</title>
  <desc id="desc">An editorial portfolio cover showing the phrase Complex logic, clear interface beside a SplitFX settlement card.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f7f2"/>
