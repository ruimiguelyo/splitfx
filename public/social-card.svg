    <path d="M263 205V262" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="292" y="220" fill="#ffffff" fill-opacity=".45" font-family="Arial,Helvetica,sans-serif" font-size="11">Settled in</text>
    <text x="292" y="252" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">3 transfers</text>
    <rect x="42" y="287" width="442" height="82" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="79" cy="328" r="21" fill="#ffad99"/>
    <text x="79" y="332" fill="#111319" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">SO</text>
